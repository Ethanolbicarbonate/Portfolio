@if (imageUrl) {
  <div
    class="image-preview-overlay"
    [class.visible]="isVisible"
    (click)="onClose()"
    role="dialog"
    aria-modal="true"
    aria-label="Full-screen illustration preview"
  >
    <!-- We stop click propagation on the image so clicking the image itself doesn't close it, only clicking the background -->
    <img
      [src]="imageUrl"
      alt="Full-screen preview of the selected illustration"
      (click)="$event.stopPropagation()"
    />
  </div>
}
