<!-- Spacer to keep the 3D canvas visible underneath -->
<div class="hero-spacer"></div>

<section id="process-section" class="process-section" #processSection>
  <!-- Independent Three.js Particle Background -->
  <canvas #processBgCanvas class="process-bg-canvas"></canvas>

  <div class="process-content">
    <!-- Hero Header -->
    <div class="process-hero">
      <h2 class="project-title">{{ processData.title }}</h2>
      <div class="tags">
        @for (tag of processData.tags; track tag) {
          <span class="tag">{{ tag }}</span>
        }
      </div>
      <div class="hero-image-wrapper">
        <img [src]="processData.heroImage" alt="Project Hero Image" />
      </div>
      <p class="project-desc">{{ processData.description }}</p>
    </div>

    <!-- Split Carousel Layout -->
    <div class="process-steps">
      <!-- Left: Navigation & Info -->
      <div class="step-info">
        <div class="step-counter">
          <span class="current-num">0{{ currentStepIndex + 1 }}</span>
          <span class="total-num"> / 0{{ processData.steps.length }}</span>
        </div>
        <h3 class="step-title">{{ currentStep.title }}</h3>

        <div class="step-controls">
          <button class="nav-btn" (click)="prevStep()" [disabled]="currentStepIndex === 0">
            &larr; Prev
          </button>
          <button
            class="nav-btn"
            (click)="nextStep()"
            [disabled]="currentStepIndex === processData.steps.length - 1"
          >
            Next &rarr;
          </button>
        </div>
      </div>

      <!-- Right: Visuals & Caption -->
      <div class="step-visuals">
        <div class="carousel-image-wrapper">
          <img
            [src]="currentStep.image"
            alt="Process step visual"
            class="carousel-image"
            [class.fade-in]="fadeTrigger"
          />
        </div>

        <div class="caption-container">
          <p class="step-caption" [class.fade-in]="fadeTrigger">
            {{ currentStep.caption }}
          </p>
          <div class="step-dots">
            @for (step of processData.steps; track $index) {
              <button
                class="carousel-dot"
                [class.active]="$index === currentStepIndex"
                (click)="setStep($index)"
                [attr.aria-label]="'Go to step ' + ($index + 1)"
              ></button>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
