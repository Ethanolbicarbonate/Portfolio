<!-- File: src/app/components/illustrations/illustrations.component.html -->
<app-scene></app-scene>
<app-text-overlay [focusedPaper]="focusedPaper" (viewImage)="onPreviewImage($event)">
</app-text-overlay>

<!-- General view logo -->
<div class="general-view-ui" [class.visible]="!focusedPaper">
  <h1 class="main-title">
    <img src="assets/images/EJC.svg" alt="EJC Logo" class="main-logo" />
  </h1>
</div>

<!-- Vertical pagination dot rail -->
<app-pagination-rail 
  [totalItems]="totalIllustrations" 
  [activeIndex]="activeDotIndex" 
  [isVisible]="dotsVisible && isAtTop" 
  (dotClick)="onDotClick($event)">
</app-pagination-rail>

<!-- Phase 3: Bottom Actions (Skip & Back) -->
@if (focusedPaper) {
  <div class="bottom-actions">
    <!-- Only show the skip button if we are at the top (canvas view) -->
    @if (isAtTop) {
      <button class="skip-button" (click)="scrollToProcess()">Skip to Process</button>
    }
    <button class="back-button" (click)="returnToGeneralView()" aria-label="Return to overview">
      &#x21A9;
    </button>
  </div>
}

<!-- Full-screen image preview overlay -->
<app-image-preview 
  [imageUrl]="previewImageUrl" 
  [isVisible]="isPreviewVisible" 
  (close)="closePreview()">
</app-image-preview>

<!-- Phase 1 Refactor: The injected Process Section Component -->
<!-- Notice we removed id="process-section" here so it doesn't conflict with the one inside the component -->
<app-process-section [processData]="processData"></app-process-section>
