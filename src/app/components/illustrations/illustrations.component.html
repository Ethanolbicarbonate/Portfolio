<app-scene></app-scene>

<div class="canvas-dimmer" [class.active]="!isAtTop"></div>

<app-text-overlay
  class="fade-on-scroll"
  [class.hidden]="!isAtTop"
  [focusedPaper]="focusedPaper"
  (viewImage)="onPreviewImage($event)"
>
</app-text-overlay>

<div
  class="general-view-ui fade-on-scroll"
  [class.visible]="!focusedPaper"
  [class.hidden]="!isAtTop"
>
  <h1 class="main-title">
    <img src="assets/images/EJC.svg" alt="EJC Logo" class="main-logo" />
  </h1>
</div>

<app-pagination-rail
  [totalItems]="totalIllustrations"
  [activeIndex]="activeDotIndex"
  [isVisible]="dotsVisible && isAtTop"
  (dotClick)="onDotClick($event)"
>
</app-pagination-rail>

@if (focusedPaper) {
  <div class="bottom-actions">
    <button
      class="skip-button fade-on-scroll"
      [class.hidden]="!isAtTop"
      (click)="scrollToProcess()"
    >
      Skip to Process
    </button>

    <button class="back-button" (click)="returnToGeneralView()" aria-label="Return to overview">
      &#x21A9;
    </button>
  </div>
}

<app-image-preview
  [imageUrl]="previewImageUrl"
  [isVisible]="isPreviewVisible"
  (close)="closePreview()"
>
</app-image-preview>

<app-process-section [processData]="processData"></app-process-section>
